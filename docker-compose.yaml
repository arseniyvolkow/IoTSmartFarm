services:
  traefik:
    image: traefik:v3.6.9
    container_name: traefik
    environment:
      - TRAEFIK_PROVIDERS_DOCKER_APIVERSION=1.53
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8081:8080"  # Dashboard access (mapped to 8081 on host)
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: unless-stopped
    networks:
      - app-network

  user_service:
    build:
      context: .
      dockerfile: user_service/Dockerfile.user_service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user.rule=PathPrefix(`/api/user-service`)"
      - "traefik.http.services.user.loadbalancer.server.port=8001"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  farm_management_service:
    build:
      context: .
      dockerfile: farm_management_service/Dockerfile.farm_management_service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.farm_management.rule=PathPrefix(`/api/farm-management-service`)"
      - "traefik.http.services.farm_management.loadbalancer.server.port=8002"
    depends_on:
      user_service:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: ".env"
    volumes:
      - "./firmware:/home/arseniy/Projects/IoTSmartFarm/firmware"
    restart: unless-stopped
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  sensor_data_service:
    build: 
      context: .
      dockerfile: sensor_data_service/Dockerfile.sensor_data_service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sensor.rule=PathPrefix(`/api/sensor-data`)"
      - "traefik.http.services.sensor.loadbalancer.server.port=8003"
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  sensor_ingestion_service:
    build: 
      context: .
      dockerfile: sensor_data_service/Dockerfile.sensor_ingestion_service
    labels:
      - "traefik.enable=false"
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    networks:
      - app-network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  rule_service:
    build:
      context: .
      dockerfile: rule_service/Dockerfile.rule_service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rule-service.rule=PathPrefix(`/api/rule-service`)"
      - "traefik.http.services.rule-service.loadbalancer.server.port=8004"
    depends_on:
      user_service:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    networks:
      - app-network

  rule_worker:
    build:
      context: .
      dockerfile: rule_worker/Dockerfile.rule_worker
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rule-worker.rule=PathPrefix(`/api/rule-worker`)"
      - "traefik.http.services.rule-worker.loadbalancer.server.port=8005"
    depends_on:
      user_service:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sensor_data_service:
        condition: service_healthy
    env_file: ".env"
    restart: unless-stopped
    networks:
      - app-network

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"  # WebSocket port
    volumes:
      - "./mosquitto/config:/mosquitto/config"
      - "./mosquitto/data:/mosquitto/data"
      - "./mosquitto/log:/mosquitto/log"
      - "./mosquitto/certs:/mosquitto/certs"
    env_file: ".env"
    ulimits:
      nofile:
        soft: 655536
        hard: 655536
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command: >
      redis-server 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    healthcheck:
      test: |
        if [ -n "$REDIS_PASSWORD" ]; then
          redis-cli -a "$REDIS_PASSWORD" ping
        else
          redis-cli ping
        fi
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - "influxdb_data:/var/lib/influxdb2"
      - "influxdb_config:/etc/influxdb2"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-password123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-myorg}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-mybucket}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-mytoken123}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    command: postgres -c 'max_connections=500'
    volumes:
      - "postgres_data:/var/lib/postgresql/data"
      - "./postgres-init:/docker-entrypoint-initdb.d"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      # These env vars will be passed to the init script
      POSTGRES_USER_DATABASE_USERNAME: ${POSTGRES_USER_DATABASE_USERNAME}
      POSTGRES_USER_DATABASE_PASSWORD: ${POSTGRES_USER_DATABASE_PASSWORD}
      POSTGRES_USER_DATABASE_NAME: ${POSTGRES_USER_DATABASE_NAME}
      POSTGRES_FARM_DATABASE_USERNAME: ${POSTGRES_FARM_DATABASE_USERNAME:-${POSTGRES_DEVICE_DATABASE_USERNAME}}
      POSTGRES_FARM_DATABASE_PASSWORD: ${POSTGRES_FARM_DATABASE_PASSWORD:-${POSTGRES_DEVICE_DATABASE_PASSWORD}}
      POSTGRES_FARM_DATABASE_NAME: ${POSTGRES_FARM_DATABASE_NAME:-${POSTGRES_DEVICE_DATABASE_NAME}}
      POSTGRES_RULE_DATABASE_USERNAME: ${POSTGRES_RULE_DATABASE_USERNAME}
      POSTGRES_RULE_DATABASE_PASSWORD: ${POSTGRES_RULE_DATABASE_PASSWORD}
      POSTGRES_RULE_DATABASE_NAME: ${POSTGRES_RULE_DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER_DATABASE_USERNAME} -d $${POSTGRES_USER_DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local
  redis_data:
    driver: local